      connection:()=>`<h2>이번 운행 사용자</h2><div class="fu-block"><h3>우리 차</h3><p>Bluetooth 연결됨</p><p>fuelog 앱 인증 완료</p><span class="fu-tag">차량에서 최종 확인 대기</span></div><p class="fu-muted">이 계정으로 새 운행을 기록합니다.</p><div class="fu-actions"><button class="fu-primary cursor-interaction" data-car="user">차량 확인 시안 보기</button></div>`,
      register:()=>`<h2>차량 등록</h2><span class="fu-tag">QR 연결 요청 확인 · 예시</span><form data-form="register"><label class="fu-field">차량 별칭<input value="우리 차" required></label><label class="fu-field">유종<select><option>휘발유</option><option>경유</option></select></label><label class="fu-field">탱크 용량 · L<input type="number" value="50" min="1"></label><p class="fu-muted">차량 사양을 확인해 입력하세요. 개인 운행은 기본 비공개입니다.</p><button class="fu-primary cursor-interaction" type="submit">차량 등록</button></form>`,
      login:()=>`<h2>내 차의 기록을 한곳에</h2><form data-form="login"><label class="fu-field">이메일<input type="email" placeholder="name@example.com" required></label><label class="fu-field">비밀번호<input type="password" placeholder="시안에는 실제 비밀번호를 입력하지 마세요" required></label><button class="fu-primary cursor-interaction" type="submit">로그인</button></form>`,
      privacy:()=>`<h2>공유 범위</h2><div class="fu-block"><span class="fu-tag">현재 비공개</span><h3 style="margin-top:14px">나만 볼 수 있어요</h3><p class="fu-muted">차량 관리자에게도 개인 운행이 자동 공개되지 않아요.</p></div><div class="fu-actions"><button class="fu-primary cursor-interaction" data-mobile="settle">정산 금액만 공유</button><button class="cursor-interaction" data-mobile="trip">비공개 유지</button></div>`,
      settings:()=>`<h2>관리</h2><div class="fu-stack"><button class="fu-full cursor-interaction" data-mobile="register">차량 정보·등록 →</button><button class="fu-full cursor-interaction" data-mobile="connection">휴대폰 연결·사용자 확인 →</button><button class="fu-full cursor-interaction" data-mobile="privacy">개인 기록·공유 범위 →</button><button class="fu-full cursor-interaction" data-mobile="reminder">정비 주기 →</button><button class="fu-full cursor-interaction" data-mobile="login">로그인 화면 시안 →</button></div>`
    };
    function render(){
      root.querySelector('.fu-car').classList.toggle('narrow',state.layout==='narrow');
      carBody.innerHTML=state.restricted?'<div class="fu-lock"><h2>주행 중 화면 제한</h2><p>정차 후 확인할 수 있어요.</p><span class="fu-muted">플랫폼 차단 상황을 설명하는 시안</span></div>':carPages[state.car]();
      mobileBody.innerHTML=mobilePages[state.mobile]();
      if(state.mobile==='fuel') mobileBody.querySelector('[name="amount"]').value=confirmedAmount;
      if(state.mobile==='settlement'){
        mobileBody.querySelector('h2').textContent=settlementTitle;
        mobileBody.querySelector('.fu-number').textContent=settlementTotal.toLocaleString('ko-KR')+' 원';
        const base=Math.floor(settlementTotal/3),extra=settlementTotal%3;
        mobileBody.querySelectorAll('.fu-block strong').forEach((el,i)=>el.textContent=(base+(i<extra?1:0)).toLocaleString('ko-KR')+'원');
      }
      root.querySelectorAll('.fu-car .fu-nav button').forEach(b=>{b.disabled=state.restricted;b.setAttribute('aria-pressed',String(b.dataset.car===state.car));});
      root.querySelector('.fu-car .fu-chrome small').textContent=state.restricted?'플랫폼 제한 상태':'우리 차 · 정차 상태';
      root.querySelector('.fu-car .fu-chrome button').disabled=state.restricted;
      root.querySelectorAll('.fu-phone .fu-nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mobile===state.mobile)));
      message.hidden=true;
    }
    render();
    function note(s){message.textContent=s;message.hidden=false;}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.car){if(state.restricted)return;state.car=b.dataset.car;render();}else if(b.dataset.mobile){state.mobile=b.dataset.mobile;render();}else if(b.dataset.action==='reject'){note('시안: 주유 후보를 기각했습니다. 실제 기록은 변경하지 않습니다.');}else if(b.dataset.action==='share'){note('시안: 정산 금액 공유 완료 상태입니다. 실제 전송은 하지 않습니다.');}});
    root.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const type=form.dataset.form;
      if(type==='fuel'){verified=true;confirmedAmount=Number(new FormData(form).get('amount'));render();note('시안: '+confirmedAmount.toLocaleString('ko-KR')+'원으로 확인했습니다. 실제 저장은 하지 않습니다.');}
      if(type==='settle'){const values=new FormData(form);settlementTotal=Number(values.get('total'));settlementTitle=String(values.get('title'));state.mobile='settlement';render();}
      if(type==='maintenance')note('시안: 정비 기록 확인 상태입니다. 실제 저장은 하지 않습니다.');
      if(type==='register'){state.mobile='home';render();note('시안: 차량 등록 완료 상태입니다.');}
      if(type==='login'){form.reset();state.mobile='home';render();note('시안 화면 전환입니다. 로그인 요청을 전송하지 않습니다.');}
    });

    const carLabels={home:'C02 · 홈',user:'C03 · 사용자 확인',trip:'C04 · 운행 요약',fuel:'C05 · 주유 감지',maintenance:'C06 · 정비 요약',settings:'C07 · 연결·설정',connect:'C01 · 차량 연결'};
    const mobileLabels={home:'M03 · 홈',fuel:'M07 · 주유 보정',trips:'M05 · 운행 목록',trip:'M06 · 운행 상세',settle:'M08 · 정산 만들기',settlement:'M09 · 정산 상세',ledger:'M10 · 차계부',maintenance:'M11 · 정비 기록',reminder:'M12 · 정비 예정',inbox:'M13 · 확인함',connection:'M04 · 사용자 연결',register:'M02 · 차량 등록',login:'M01 · 로그인',privacy:'M06 · 공유 범위',settings:'M14 · 관리'};
    for(const [kind,labels]of Object.entries({car:carLabels,mobile:mobileLabels})){
      const select=root.querySelector('[data-preview="'+kind+'"]');
      Object.entries(labels).forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option);});
      select.value=state[kind];
    }
    function syncPreview(){root.querySelectorAll('[data-preview]').forEach(el=>el.value=String(state[el.dataset.preview]));}
    root.addEventListener('change',e=>{const kind=e.target.dataset.preview;if(!kind)return;state[kind]=kind==='restricted'?e.target.value==='true':e.target.value;render();syncPreview();});
    root.addEventListener('click',()=>syncPreview());
    root.addEventListener('submit',()=>syncPreview());
    root.addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button)return;
      if(button.dataset.mobile&&button.closest('.fu-car'))root.querySelector('.fu-phone').scrollIntoView({block:'start'});
      if(button.dataset.car&&button.closest('.fu-phone'))root.querySelector('.fu-car').scrollIntoView({block:'start'});
    });
    syncPreview();
  })();
  </script>
</div>









</body>
</html>
