plugins {
    alias(libs.plugins.android.application)
}

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def apiBaseUrl = providers.gradleProperty('API_BASE_URL')
        .orElse(localConfig.getProperty('API_BASE_URL', '')).get().trim()
def quotedApiBaseUrl = groovy.json.JsonOutput.toJson(apiBaseUrl)
def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('.signing/release.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'com.pleos.fuelog'
    compileSdk 36
    useLibrary 'android.car'

    defaultConfig {
        applicationId "com.pleos.fuelog"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'API_BASE_URL', quotedApiBaseUrl

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (!releaseSigning.isEmpty()) {
            release {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (!releaseSigning.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'com.google.zxing:core:3.5.3'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.okhttp
    implementation libs.pleos.vehicle
    implementation libs.pleos.location
    testImplementation libs.junit
    testImplementation libs.mockwebserver
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.mockwebserver
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
